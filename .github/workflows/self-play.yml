name: Self-play dataset

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-stockfish
        id: stockfish
      - run: bun run self-play self-play/games.jsonl public/model.f32 16 96 "$GITHUB_RUN_ID" 4
        env:
          STOCKFISH: ${{ steps.stockfish.outputs.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: choux-self-play
          path: self-play/games.jsonl
          if-no-files-found: error
          overwrite: true
