name: Check code

on:
  push:
  pull_request:
  issues:
    types: [opened]
  workflow_run:
    workflows: ["Self-play dataset"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      retrain:
        description: Collect submitted and self-play games and retrain before deployment
        type: boolean
        default: false
      match_benchmark:
        description: Play full matches against Stockfish and the incumbent when retraining
        type: boolean
        default: false

concurrency:
  group: choux-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate-submission:
    if: github.event_name == 'issues' && github.event.issue.title == 'Choux training game'
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: validate
        run: |
          bun -e "
            import { parseSubmission } from './scripts/dataset';
            const { issue } = await Bun.file(Bun.env.GITHUB_EVENT_PATH).json();
            console.log('valid=' + Boolean(parseSubmission(issue.body ?? '')));
          " >> "$GITHUB_OUTPUT"

  retrain:
    needs: validate-submission
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'issues' && needs.validate-submission.outputs.valid == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.retrain) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      issues: read
    outputs:
      revision: ${{ steps.persist.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Collect recent self-play batches
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow self-play.yml \
            --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId')
          mkdir -p self-play
          : > self-play/games.jsonl
          collected=0
          seen_trigger=false
          for run_id in $TRIGGER_RUN_ID $runs; do
            if [[ "$run_id" == "$TRIGGER_RUN_ID" ]]; then
              if [[ "$seen_trigger" == true ]]; then
                continue
              fi
              seen_trigger=true
            fi
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=choux-self-play" \
              --jq '.artifacts[] | select(.expired == false) | .id')
            if [[ -z "$artifact" ]]; then
              if [[ "$run_id" == "$TRIGGER_RUN_ID" ]]; then
                echo "::error::Missing self-play artifact from triggering run $run_id."
                exit 1
              fi
              echo "No available self-play artifact for run $run_id."
              continue
            fi
            batch="$RUNNER_TEMP/choux-self-play/$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name choux-self-play --dir "$batch"
            cat "$batch/games.jsonl" >> self-play/games.jsonl
            echo "Collected self-play run $run_id."
            collected=$((collected + 1))
            if [[ "$collected" -eq 6 ]]; then
              break
            fi
          done
          echo "Collected $collected self-play batches."
      - uses: ./.github/actions/setup-stockfish
        id: stockfish
      - run: |
          args=()
          if [[ -s self-play/games.jsonl ]]; then
            args+=(self-play/games.jsonl)
          fi
          bun run train "$RUNNER_TEMP/candidate.f32" data/games.jsonl public/model.f32 "${args[@]}"
        env:
          CHOUX_TRAINING_REPORT: ${{ runner.temp }}/training-report.json
          CHOUX_TRAINING_STOCKFISH: "1"
          CHOUX_POLICY_POSITIONS: ${{ runner.temp }}/policy-positions.json
          STOCKFISH: ${{ steps.stockfish.outputs.executable }}
      - name: Train Stockfish move preferences
        env:
          STOCKFISH: ${{ steps.stockfish.outputs.executable }}
        run: bun scripts/train-policy.ts "$RUNNER_TEMP/candidate.f32" "$RUNNER_TEMP/policy-positions.json"
      - name: Compare both models with Stockfish
        env:
          STOCKFISH: ${{ steps.stockfish.outputs.executable }}
        run: bun run benchmark:strength "$RUNNER_TEMP/candidate.f32" public/model.f32 "$RUNNER_TEMP/stockfish-report.json"
      - name: Play paired benchmark games
        if: inputs.match_benchmark
        env:
          STOCKFISH: ${{ steps.stockfish.outputs.executable }}
        run: bun run benchmark:matches "$RUNNER_TEMP/candidate.f32" public/model.f32 "$RUNNER_TEMP/match-report.json"
      - uses: actions/upload-artifact@v7
        with:
          name: stockfish-benchmark-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stockfish-report.json
            ${{ runner.temp }}/training-report.json
            ${{ runner.temp }}/match-report.json
          if-no-files-found: error
      - name: Check Stockfish promotion gate
        id: stockfish_gate
        run: |
          bun -e '
            const { candidate, incumbent } = await Bun.file(Bun.argv[1]).json();
            if (!Number.isFinite(candidate?.meanLoss) || !Number.isFinite(incumbent?.meanLoss))
              throw new Error("Stockfish report is missing a finite mean loss.");
            const passes = candidate.meanLoss <= incumbent.meanLoss;
            console.error(`Stockfish gate ${passes ? "passed" : "failed"}. Mean expected-score loss: candidate ${candidate.meanLoss} pp, incumbent ${incumbent.meanLoss} pp.`);
            console.log(`passes=${passes}`);
          ' "$RUNNER_TEMP/stockfish-report.json" >> "$GITHUB_OUTPUT"
      - name: Verify candidate and persist accepted data
        id: persist
        env:
          STOCKFISH_GATE_PASSED: ${{ steps.stockfish_gate.outputs.passes }}
        run: |
          promoted=false
          if [[ "$STOCKFISH_GATE_PASSED" == "true" ]] &&
            jq -e '.eligible' "$RUNNER_TEMP/training-report.json" >/dev/null &&
            ! cmp -s "$RUNNER_TEMP/candidate.f32" public/model.f32; then
            bun run evaluate "$RUNNER_TEMP/candidate.f32"
            mv "$RUNNER_TEMP/candidate.f32" public/model.f32
            promoted=true
          fi
          bun scripts/record-model-history.ts "$RUNNER_TEMP/training-report.json" "$RUNNER_TEMP/stockfish-report.json" "$promoted"
          if [[ -f data/games.jsonl ]]; then
            git add data/games.jsonl
          fi
          git add public/model.f32 public/model-history.jsonl
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record Choux training run'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: choux-checkpoint
          path: public/model.f32
          if-no-files-found: error
          overwrite: true

  check:
    needs: retrain
    if: >-
      !cancelled() && (needs.retrain.result == 'success' ||
      (github.event_name != 'workflow_run' && github.event_name != 'issues' &&
      needs.retrain.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      pages_artifact: ${{ steps.source.outputs.pages_artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.retrain.outputs.revision || github.sha }}
          persist-credentials: false
      - name: Identify build source
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pages_artifact=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - if: needs.retrain.outputs.revision != ''
        uses: actions/download-artifact@v8
        with:
          name: choux-checkpoint
          path: public
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run biome:check
      - run: bun run check
      - run: bun run evaluate
      - run: bun run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.source.outputs.pages_artifact }}
          path: dist

  deploy:
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check the build revision is current
        id: current
        env:
          REVISION: ${{ needs.check.outputs.revision }}
        run: |
          remote=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main)
          if [[ "${remote%%$'\t'*}" == "$REVISION" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer revision is on main. Skipping this deployment.'
          fi
      - id: deploy
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.check.outputs.pages_artifact }}
